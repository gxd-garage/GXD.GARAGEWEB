# Configuración del panel de edición (Pages CMS: https://app.pagescms.org)
# Define qué puedes editar desde el panel y qué campos tiene cada cosa.

media:
  input: public/media
  output: /media

content:
  - name: productos
    label: Productos
    type: collection
    path: contenido/productos
    filename: "{primary}.md"
    view:
      fields: [titulo, categoria, seccion, tipo_venta, stock, publicado]
      primary: titulo
      sort: [orden, titulo]
      default:
        sort: orden
        order: asc
    fields:
      - name: titulo
        label: Nombre del producto
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values: ["Impresión 3D", "Diseño gráfico", "Impresión digital"]
        description: Define en qué página aparece (Impresión 3D, Diseño gráfico o Impresión digital).
      - name: seccion
        label: Sección de Impresión 3D
        type: select
        description: "Solo para Impresión 3D. Repuestos para autos: piezas para autos (van junto al formulario de repuestos). Productos: lo que se pide eligiendo el color, en stock o a pedido. Hecho a medida: servicios que se diseñan para cada cliente."
        options:
          values: ["Repuestos para autos", "Productos", "Hecho a medida"]
      - name: subcategoria
        label: Tipo (opcional)
        type: select
        description: Solo para Impresión 3D. En Productos sirve para los filtros (aparecen con 6 productos o más); en Hecho a medida, "Letreros y emblemas" va en el grupo Para tu marca o institución.
        options:
          values: ["Repuestos para autos", "Accesorios para autos", "Fidgets y juguetes", "Lámparas y decoración", "Hogar y repuestos varios", "Llaveros NFC", "Letreros y emblemas", "Figuras y miniaturas", "Prototipos y modelado"]
      - name: etiqueta
        label: Etiqueta (opcional)
        type: string
        description: Un tipo más específico que se muestra junto a la categoría, por ejemplo Lámparas, Repuestos o Stickers.
      - name: resumen
        label: Resumen
        type: text
        description: Una o dos frases. Aparece bajo el nombre y es lo que Google muestra en los resultados.
        options:
          maxlength: 180
      - name: colores
        label: Colores disponibles
        type: select
        description: Elige uno o varios. El cliente escoge el color en la ficha y se incluye en su mensaje de WhatsApp. El primero es el que aparece marcado. Si lo dejas vacío, se usan los colores por defecto de Datos del negocio.
        options:
          multiple: true
          values: ["Negro", "Blanco", "Gris", "Plateado", "Rojo", "Naranjo", "Amarillo", "Verde", "Azul", "Celeste", "Morado", "Rosado", "Café", "Dorado", "Madera", "Transparente", "Multicolor"]
      - name: ocultar_colores
        label: Ocultar colores
        type: boolean
        description: Actívalo en los productos donde no se elige color (por ejemplo un logo o un banner). No se muestran las muestras ni el selector.
      - name: tipo_venta
        label: Disponibilidad
        type: select
        description: Solo para Impresión 3D. "En stock" muestra cuántas quedan y el precio; "Hecho a pedido" se cotiza.
        options:
          values: ["Hecho a pedido", "En stock"]
      - name: stock
        label: Unidades en stock
        type: number
        description: Solo si Disponibilidad es "En stock". Con 5 o menos dice "Quedan 3"; con 0 dice "Agotado" y el cliente puede pedir que le avisen. Actualízalo cuando vendas.
      - name: compatibilidad
        label: Compatible con (autos)
        type: string
        list: true
        description: Opcional. Un auto por línea, por ejemplo "Toyota Yaris 2006-2013". Aparece en la ficha y sirve para el buscador.
      - name: precio
        label: Precio o valor de referencia (CLP, opcional)
        type: number
        description: Solo el número, sin puntos ni signo peso. En las piezas "En stock" se muestra siempre. En el resto, solo si activas "Mostrar este precio" o "Mostrar valores de referencia" en Datos del negocio; si no, aparece como "A cotizar".
      - name: precio_visible
        label: Mostrar este precio
        type: boolean
        description: Muestra el precio de este producto aunque el resto del sitio esté "A cotizar".
      - name: precio_desde
        label: Mostrar como "Desde"
        type: boolean
        description: Actívalo cuando el precio es el mínimo y depende del tamaño o la cantidad.
      - name: oferta_activa
        label: Oferta activa
        type: boolean
        description: Muestra el precio de oferta y la etiqueta en el catálogo y en la ficha, aunque el resto del catálogo esté "A cotizar".
      - name: precio_oferta
        label: Precio de oferta (CLP)
        type: number
        description: Solo el número. Si además completas "Valor de referencia", se muestra tachado como precio anterior.
      - name: oferta_texto
        label: Etiqueta de la oferta
        type: string
        description: Texto corto de la etiqueta, por ejemplo "Promo Noviembre" o "-20%". Si lo dejas vacío dice "Oferta".
      - name: oferta_detalle
        label: Detalle de la oferta
        type: string
        description: Opcional. Por ejemplo "$2.700 c/u comprando 15 o más".
      - name: oferta_hasta
        label: Oferta válida hasta
        type: date
        description: Opcional. Después de esta fecha la oferta deja de mostrarse sola.
      - name: imagenes
        label: Fotos
        type: image
        description: "Tamaño ideal 1600 × 1200 px, horizontal 4:3 (mínimo 1200 × 900). JPG o WebP de menos de 500 KB. El sitio recorta cada foto a 4:3 sin deformarla: deja el producto al centro y con aire alrededor. La primera foto es la portada del producto."
        options:
          multiple:
            max: 6
          extensions: [jpg, jpeg, png, webp]
      - name: detalles
        label: Detalles
        type: string
        list: true
        description: Puntos breves, por ejemplo materiales, medidas o tiempos de entrega.
      - name: destacado
        label: Destacado en la portada
        type: boolean
      - name: orden
        label: Orden
        type: number
        description: Los números más bajos aparecen primero.
      - name: publicado
        label: Publicado
        type: boolean
        description: Desactívalo para ocultar el producto sin borrarlo.
      - name: body
        label: Descripción completa
        type: rich-text
        options:
          format: markdown

  - name: portafolio
    label: Portafolio
    type: collection
    path: contenido/portafolio
    filename: "{primary}.md"
    view:
      fields: [titulo, categoria, publicado]
      primary: titulo
      sort: [orden, titulo]
      default:
        sort: orden
        order: asc
    fields:
      - name: titulo
        label: Nombre del trabajo
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values: ["Impresión 3D", "Diseño gráfico", "Impresión digital"]
      - name: imagen
        label: Foto
        type: image
        required: true
        description: "Foto real del trabajo terminado. Tamaño ideal 1600 × 1200 px, horizontal 4:3 (mínimo 1200 × 900). JPG o WebP de menos de 500 KB. Deja el trabajo al centro: los bordes pueden recortarse un poco."
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: orden
        label: Orden
        type: number
        description: Los números más bajos aparecen primero.
      - name: publicado
        label: Publicado
        type: boolean

  - name: blog
    label: Blog
    type: collection
    path: contenido/blog
    filename: "{primary}.md"
    view:
      fields: [titulo, categoria, fecha, borrador]
      primary: titulo
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
        description: Escríbelo como lo buscaría la gente en Google.
      - name: descripcion
        label: Descripción para Google
        type: text
        required: true
        description: Entre 120 y 160 caracteres. Aparece en los resultados de búsqueda y al compartir el enlace.
        options:
          maxlength: 170
      - name: categoria
        label: Categoría
        type: select
        required: true
        description: Guías responde preguntas, Proyectos muestra trabajos reales y Novedades es para anuncios y promociones.
        options:
          values: ["Guías", "Proyectos", "Novedades"]
      - name: fecha
        label: Fecha de publicación
        type: date
        required: true
      - name: portada
        label: Imagen de portada
        type: image
        description: "Opcional. Tamaño ideal 1600 × 900 px, horizontal 16:9 (mínimo 1200 × 675). JPG o WebP de menos de 500 KB. Dentro del artículo se recorta un poco arriba y abajo: deja lo importante al centro."
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: borrador
        label: Borrador
        type: boolean
        description: Actívalo para guardar el artículo sin publicarlo.
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown

  - name: promocion
    label: Ventana promocional
    type: file
    path: contenido/promocion.json
    fields:
      - name: activa
        label: Mostrar la ventana
        type: boolean
        description: Enciéndela para que aparezca a los visitantes. Apágala cuando termine la promoción.
      - name: etiqueta
        label: Etiqueta pequeña
        type: string
        description: Opcional, aparece arriba del título. Por ejemplo "Promo del mes".
      - name: titulo
        label: Título
        type: string
        required: true
      - name: titulo_cursiva
        label: Segunda línea en cursiva
        type: string
        description: Opcional. Va debajo del título con la letra en cursiva, como en el resto del sitio.
      - name: texto
        label: Texto
        type: text
        options:
          maxlength: 220
      - name: imagen
        label: Imagen
        type: image
        description: "Opcional. Tamaño ideal 1200 × 1200 px, cuadrada (mínimo 800 × 800). JPG o WebP de menos de 400 KB. En computador va al lado del texto y en celular arriba, como franja horizontal: deja lo importante al centro."
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: boton_texto
        label: Texto del botón
        type: string
      - name: boton_enlace
        label: Enlace del botón
        type: string
        description: Escribe "whatsapp" para abrir WhatsApp, o una página del sitio como /impresion-3d/llavero-nfc/, /impresion-3d/ o /cotizar/.
      - name: mensaje_whatsapp
        label: Mensaje de WhatsApp
        type: string
        description: Solo si el botón abre WhatsApp. Si lo dejas vacío se arma un mensaje con el título de la promoción.
      - name: desde
        label: Mostrar desde
        type: date
        description: Opcional.
      - name: hasta
        label: Mostrar hasta
        type: date
        description: Opcional. Después de esta fecha deja de aparecer sola.
      - name: paginas
        label: Dónde aparece
        type: select
        options:
          values: ["Todas las páginas", "Solo el inicio"]
      - name: frecuencia
        label: Cada cuánto se muestra a un mismo visitante
        type: select
        options:
          values: ["Una vez", "Una vez por día", "Cada visita"]
      - name: retraso
        label: Segundos antes de aparecer
        type: number
        description: Recomendado entre 3 y 8 para no interrumpir apenas entra la persona.

  - name: servicios
    label: Imágenes de las páginas de servicio
    type: file
    path: contenido/servicios.json
    fields:
      - name: banner_3d
        label: Banner de Impresión 3D
        type: image
        description: "Imagen de fondo del encabezado de /impresion-3d/. Ideal 1600 × 1200 px o más, con fondo oscuro y el motivo al centro o a la derecha: la parte izquierda queda tapada por el texto. JPG o WebP de menos de 400 KB. Si la dejas vacía, el encabezado va sin imagen."
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: banner_diseno
        label: Banner de Diseño gráfico
        type: image
        description: "Imagen de fondo del encabezado de /diseno-grafico/. Mismas medidas: 1600 × 1200 px o más, fondo oscuro, motivo al centro o a la derecha."
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: banner_digital
        label: Banner de Impresión digital
        type: image
        description: "Imagen de fondo del encabezado de /impresion-digital/. Mismas medidas: 1600 × 1200 px o más, fondo oscuro, motivo al centro o a la derecha."
        options:
          extensions: [jpg, jpeg, png, webp]

  - name: sitio
    label: Datos del negocio
    type: file
    path: contenido/sitio.json
    fields:
      - name: nombre
        label: Nombre
        type: string
      - name: url
        label: Dirección del sitio
        type: string
        description: Con https y sin barra al final, por ejemplo https://gxdgarage.cl
      - name: slogan
        label: Slogan
        type: string
      - name: descripcion
        label: Descripción para Google
        type: text
        description: Lo que Google muestra bajo el nombre del sitio en la portada.
      - name: whatsapp
        label: WhatsApp (solo números)
        type: string
        description: Con código de país y sin el signo +, por ejemplo 56983409755
      - name: whatsapp_visible
        label: WhatsApp como se muestra
        type: string
      - name: mensaje_whatsapp
        label: Mensaje inicial de WhatsApp
        type: string
      - name: mostrar_precios
        label: Mostrar valores de referencia
        type: boolean
        description: Apagado, todo el catálogo aparece como "A cotizar". Encendido, se muestran los valores de referencia de los productos que lo tengan.
      - name: colores_por_defecto
        label: Colores por defecto
        type: select
        description: Los colores que tienen todos los productos que no tienen colores propios. En cada producto puedes poner otros o activar "Ocultar colores".
        options:
          multiple: true
          values: ["Negro", "Blanco", "Gris", "Plateado", "Rojo", "Naranjo", "Amarillo", "Verde", "Azul", "Celeste", "Morado", "Rosado", "Café", "Dorado", "Madera", "Transparente", "Multicolor"]
      - name: instagram
        label: Usuario de Instagram
        type: string
        description: Sin @
      - name: direccion
        label: Dirección
        type: string
      - name: comuna
        label: Comuna
        type: string
      - name: region
        label: Región
        type: string
      - name: codigo_postal
        label: Código postal
        type: string
      - name: horario
        label: Horario de atención
        type: string
        description: Opcional, por ejemplo "Lunes a viernes de 10:00 a 19:00"
